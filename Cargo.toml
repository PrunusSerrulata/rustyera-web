[workspace]
members = [
    "crates/era-web-bridge",
    "crates/era-web-wasm",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.0.1-alpha.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
blake3 = "1.5.5"
era-debug-protocol = { git = "https://github.com/PrunusSerrulata/rustyera-core.git", rev = "cda8aba139a39cb551c1809471674663bba3d79f" }
era-protocol = { git = "https://github.com/PrunusSerrulata/rustyera-core.git", rev = "cda8aba139a39cb551c1809471674663bba3d79f" }
era-runtime = { git = "https://github.com/PrunusSerrulata/rustyera-core.git", rev = "cda8aba139a39cb551c1809471674663bba3d79f" }
era-runtime-protocol = { git = "https://github.com/PrunusSerrulata/rustyera-core.git", rev = "cda8aba139a39cb551c1809471674663bba3d79f" }
erabasic-vm = { git = "https://github.com/PrunusSerrulata/rustyera-core.git", rev = "cda8aba139a39cb551c1809471674663bba3d79f" }
minicbor = { version = "2.2.2", features = ["derive", "std"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.112"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 2
