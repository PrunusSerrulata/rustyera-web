name: Build and publish Web/Tauri frontend

on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: Release type
        required: true
        default: prerelease
        type: choice
        options: [release, prerelease, none]
      tag_name:
        description: Tag to create when publishing (for example, v0.1.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: npm ci
      - run: npm run check:core-rev
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:wasm
      - run: npm run build
      - name: Archive browser application
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath rustyera-web-browser.zip
      - uses: actions/upload-artifact@v7
        with:
          name: rustyera-web-browser
          path: rustyera-web-browser.zip
          archive: false

  tauri:
    name: Tauri (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-latest }
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:core-rev
      - run: cargo check --workspace --all-targets --locked
      - run: npm run tauri build
      - name: Archive Tauri bundles
        shell: pwsh
        run: Compress-Archive -Path target/release/bundle/* -DestinationPath rustyera-web-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: rustyera-web-${{ matrix.name }}
          path: rustyera-web-${{ matrix.name }}.zip
          archive: false

  publish:
    if: inputs.publish_type != 'none'
    needs: [browser, tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Require tag
        if: inputs.tag_name == ''
        run: exit 1
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
          skip-decompress: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.publish_type == 'prerelease' }}
          generate_release_notes: true
          files: packages/*.zip
