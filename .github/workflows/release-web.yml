name: Build and publish Web/Tauri frontend

run-name: Web/Tauri ${{ inputs.tag_name || github.sha }}

on:
  workflow_dispatch:
    inputs:
      publish_type:
        description: Release type
        required: true
        default: prerelease
        type: choice
        options: [release, prerelease, none]
      tag_name:
        description: Tag to create when publishing (for example, v0.1.0)
        required: false
        type: string
      core_commit:
        description: Full rustyera-core commit SHA (leave empty for the default branch HEAD)
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-web-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-core:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.core.outputs.revision }}
    steps:
      - name: Resolve core revision
        id: core
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
        run: |
          revision="$CORE_COMMIT"
          if [[ -z "$revision" ]]; then
            revision="$(git ls-remote https://github.com/PrunusSerrulata/rustyera-core.git HEAD | awk '$2 == "HEAD" { print $1; exit }')"
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "core_commit must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  browser:
    needs: resolve-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Pin core dependencies
        shell: pwsh
        run: node scripts/pin-core-dependencies.mjs '${{ needs.resolve-core.outputs.revision }}'
      - name: Refresh lockfile for selected core
        run: cargo update
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: npm ci
      - run: npm run check:core-rev
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:wasm
      - run: npm run build
      - name: Archive browser application
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath rustyera-web-browser.zip
      - uses: actions/upload-artifact@v7
        with:
          name: rustyera-web-browser
          path: rustyera-web-browser.zip
          if-no-files-found: error
          retention-days: 7

  tauri:
    name: Tauri (${{ matrix.name }})
    needs: resolve-core
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-latest }
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Pin core dependencies
        shell: pwsh
        run: node scripts/pin-core-dependencies.mjs '${{ needs.resolve-core.outputs.revision }}'
      - name: Refresh lockfile for selected core
        run: cargo update
      - run: npm ci
      - run: npm run check:core-rev
      - run: cargo check --workspace --all-targets --locked
      - name: Build portable Windows application
        if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle
      - name: Archive portable Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/era-web-tauri.exe -DestinationPath rustyera-web-windows-x86_64-portable.zip
      - name: Build Tauri bundles
        if: runner.os != 'Windows'
        run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: rustyera-web-${{ matrix.name }}
          path: |
            rustyera-web-*-portable.zip
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish_type != 'none'
    needs: [browser, tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Require tag
        if: inputs.tag_name == ''
        run: exit 1
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.publish_type == 'prerelease' }}
          generate_release_notes: true
          body: |
            ## 使用说明

            ### 桌面版（推荐）

            - Windows：下载 `windows-x86_64-portable.zip`，完整解压后运行其中的 `era-web-tauri.exe`。
            - macOS：按处理器下载对应的 `.dmg`（Apple 芯片选 `arm64`，Intel 选 `x86_64`），打开后将应用安装到“应用程序”。如果系统提示应用来自身份不明的开发者，请确认文件下载自本发布页，然后在终端执行 `xattr -dr com.apple.quarantine /Applications/RustyEra.app` 解除隔离。
            - Linux：按 CPU 架构下载 `.AppImage`、`.deb` 或 `.rpm`；AppImage 首次运行前需要添加可执行权限。

            启动后点击“打开 Era 项目…”，选择包含 `CSV/` 和 `ERB/` 的游戏目录。

            ### 浏览器版

            下载 `rustyera-web-browser.zip` 并解压，将内容部署到 HTTPS 网站或通过 localhost 静态服务器访问，再使用桌面版 Chromium 打开。浏览器版不能直接双击 `index.html` 运行，并需要授权所选游戏目录的读写权限。
          files: |
            packages/**/*.zip
            packages/**/*.dmg
            packages/**/*.AppImage
            packages/**/*.deb
            packages/**/*.rpm
