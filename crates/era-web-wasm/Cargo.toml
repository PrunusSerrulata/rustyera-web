[package]
name = "era-web-wasm"
version = "0.7.0-wasm"
edition.workspace = true
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3.workspace = true
era-debug-protocol.workspace = true
era-runtime.workspace = true
era-runtime-protocol.workspace = true
era-web-bridge = { path = "../era-web-bridge" }
js-sys = "0.3.81"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.104"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# Multiple tables are part of reference-types, but wasm-pack does not enable that Binaryen parser
# feature unless asked explicitly. Keep the release optimizer enabled with the required feature.
wasm-opt = ["-O", "--enable-reference-types"]
