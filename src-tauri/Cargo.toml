[package]
name = "era-web-tauri"
version = "0.10.0-alpha.1-tauri"
edition.workspace = true
license.workspace = true

[features]
native-sql = ["dep:era-sql-provider"]
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
performance-audit = ["webdriver", "era-web-bridge/performance-audit", "dep:minicbor", "dep:rustix", "dep:block2", "dep:objc2-foundation"]
vm-instruction-profile = ["performance-audit", "era-web-bridge/vm-instruction-profile"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
base64 = "0.22.1"
blake3.workspace = true
era-protocol.workspace = true
era-debug-protocol.workspace = true
era-runtime.workspace = true
era-runtime-protocol.workspace = true
era-sql-provider = { workspace = true, optional = true }
era-web-bridge = { path = "../crates/era-web-bridge" }
encoding_rs = "0.8.35"
fontdb = "0.22.0"
glob = "0.3.3"
mimalloc = "0.1.52"
minicbor = { workspace = true, optional = true }
schemars = "=1.2.1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tempfile = "3.20.0"
unicode-normalization = "0.1.24"
walkdir = "2.5.0"

[lints]
workspace = true

[dev-dependencies]
minicbor.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.4", features = ["time"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "block2"], optional = true }
